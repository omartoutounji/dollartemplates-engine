[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dollartemplates-engine"
version = "1.0.0"
description = "Semantic e-ink template engine for DollarTemplates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cairosvg>=2.7,<3",
  "Pillow>=10,<13",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
dt = "dollartemplates.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
